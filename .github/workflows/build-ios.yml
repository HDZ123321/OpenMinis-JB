name: Build iOS

# Builds the Minis app for device arm64 without code signing.
#
# The native dependency chain (LAME, FFmpeg, iSH, Alpine rootfs, rclone) is
# expensive — 30 to 60 minutes cold — so it is cached. The cache key covers
# everything that can change the produced binaries: our own build scripts, the
# submodule commits, and the rclone module pin. A Swift-only change therefore
# reuses the cache and only pays the Xcode build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 is arm64 and ships Xcode 26.x with an iOS 26 SDK. The app targets
    # IPHONEOS_DEPLOYMENT_TARGET = 26.2 and the dependency products are device
    # arm64 only, so an Intel runner would be useless here.
    runs-on: macos-26
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # deps/ish and deps/proot are submodules; deps/ish has its own nested
          # submodules (libapps, libarchive, linux). build_ish.sh would
          # initialize them too, but doing it here lets the cache key below see
          # the real tree.
          submodules: recursive
          fetch-depth: 1

      - name: Report toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          echo "--- installed SDKs"
          xcodebuild -showsdks | sed -n '1,40p'
          echo "--- go"
          go version || true
          echo "--- ninja"
          ninja --version || true

      - name: Install build prerequisites
        run: |
          # BUILDING.md: ninja, llvm, libarchive, pkg-config from Homebrew;
          # meson from pip. The runner image already carries ninja, Go, Python
          # and Homebrew itself, so only the rest is installed here.
          brew install llvm libarchive pkg-config

          # meson must land on PATH for the later steps. With Homebrew's Python
          # a plain `--user` install goes to ~/Library/Python/3.x/bin, not
          # ~/.local/bin, so ask Python where it actually put the scripts
          # instead of guessing.
          python3 -m pip install --user --break-system-packages meson
          MESON_BIN="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts", "posix_user"))')"
          echo "meson scripts dir: $MESON_BIN"
          ls -l "$MESON_BIN" || true
          echo "$MESON_BIN" >> "$GITHUB_PATH"

      - name: Set up Go
        # build_rclone_ios.sh needs Go >= 1.25.5 (deps/rclone-mobile/go.mod).
        # The image has Go unpacked somewhere but not on PATH, so pin it here
        # rather than hunting for the directory.
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Verify prerequisites
        run: |
          # Diagnose every requirement instead of dying on the first one: a
          # silent `set -e` failure here cost a whole run with no output.
          set -uo pipefail
          fail=0
          need() {
            local what="$1" cmd="$2"
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "OK   $what -> $(command -v "$cmd") ($("$cmd" --version 2>&1 | head -1))"
            else
              echo "MISS $what -> $cmd not on PATH"
              fail=1
            fi
          }
          need meson meson
          need ninja ninja
          need pkg-config pkg-config
          need go go

          # build_ish.sh looks for clang at this exact path to build the guest
          # VDSO. A miss is only a warning there, but a missing VDSO makes the
          # guest fall back to a slower path, so fail loudly instead.
          if [ -x /opt/homebrew/opt/llvm/bin/clang ]; then
            echo "OK   llvm clang -> /opt/homebrew/opt/llvm/bin/clang"
          else
            echo "MISS llvm clang -> /opt/homebrew/opt/llvm/bin/clang"
            ls -d /opt/homebrew/opt/llvm* 2>/dev/null || echo "     (no /opt/homebrew/opt/llvm*)"
            fail=1
          fi

          if [ -d /opt/homebrew/opt/libarchive/lib ]; then
            echo "OK   libarchive -> /opt/homebrew/opt/libarchive/lib"
          else
            echo "MISS libarchive -> /opt/homebrew/opt/libarchive/lib"
            fail=1
          fi

          echo "PATH=$PATH"
          exit $fail

      - name: Metal toolchain
        # No .metal sources exist in the tree today, but Xcode 26 gates some
        # build phases behind the separately downloadable Metal toolchain.
        # Non-fatal: a failure here must not block a build that never needed it.
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Record submodule commits
        # hashFiles() hashes files, not directories, so the submodule SHAs go
        # through a scratch file that the cache key then hashes.
        run: |
          git submodule status --recursive > .submodule-shas
          cat .submodule-shas

      - name: Restore native dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources
            deps/frameworks
            deps/ish/build-native
          key: deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/build_aot.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/rclone-mobile/go.mod','.submodule-shas') }}

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        # Named through `bash` on purpose: this checkout lands on a Windows
        # filesystem, so git records every script as mode 100644 and the
        # executable bit never reaches CI. Running it as ./script fails with
        # "Permission denied"; naming the interpreter sidesteps the mode.
        run: bash scripts/ci/build_deps.sh

      - name: Confirm dependency products
        # A cache hit skips the build, so the products are only assumed present.
        # Check the exact files pbxproj links and embeds before trusting them.
        run: |
          set -euo pipefail
          for f in \
            deps/libs/libish.a \
            deps/libs/libish_emu.a \
            deps/libs/libfakefs.a \
            deps/libs/libish_aot.a \
            deps/include/ish/ish.h \
            deps/resources/alpine-rootfs.zip \
            deps/resources/RootfsPatch.bundle \
            deps/frameworks/FFmpeg.xcframework \
            deps/frameworks/Rclone.xcframework
          do
            if [ ! -e "$f" ]; then
              echo "::error::missing dependency product: $f"
              exit 1
            fi
            echo "ok  $f"
          done

      - name: Write ProviderCustomization.xcconfig
        # The repository ships only the .example: these values are per-builder
        # and one of them (ANTHROPIC_OAUTH_IDENTIFIER_PROMPT) is only needed for
        # Claude OAuth. An empty file compiles, which is what CI wants.
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          echo "--- generated:"
          cat src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build Minis
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package .app
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData/Build/Products -maxdepth 3 -name 'Minis.app' -type d | head -1)"
          test -n "$APP"
          echo "app: $APP"
          du -sh "$APP"
          mkdir -p build/artifacts
          # ditto keeps the bundle structure and symlinks intact; plain zip on
          # a .app can lose resource forks Xcode writes.
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/artifacts/Minis-unsigned.zip
          ls -lh build/artifacts

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-${{ github.sha }}
          path: build/artifacts/*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.sha }}
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
